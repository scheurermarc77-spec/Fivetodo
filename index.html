<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FiveTodo" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>FiveTodo</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GEMEINSAM · LIVE</div>
        <h1>FiveTodo</h1>
      </div>
      <div class="status" id="status">
        <span class="dot"></span><span id="statusText">Verbinde…</span>
      </div>
    </header>

    <main id="days" class="days" aria-live="polite"></main>
  </div>

  <div id="bravo" class="bravo" aria-hidden="true">
    <div class="bravo-card">
      <div class="confetti">✦ ✹ ✦</div>
      <div class="bravo-title">BRAVO!</div>
      <div class="bravo-sub">Erledigt. Stark gemacht.</div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
