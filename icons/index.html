<!doctype html>
<html lang="de">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/leon-anouk-at-work-180-v4.png?v=20260815-1707">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FiveTodo" />
  <link rel="manifest" href="manifest.webmanifest?v=20260815-1707" />
  <link rel="stylesheet" href="styles.css" />
  <title>FiveTodo</title>
</head>
<body>
  <div id="profileChooser" class="profile-chooser">
    <div class="profile-card">
      <div class="profile-eyebrow">FIVETODO</div>
      <h1>Für wen?</h1>
      <p>Wähle deine Aufgabenliste.</p>

      <div class="profile-buttons">
        <button class="profile-button leon" type="button" data-profile="leon">
          <span class="profile-avatar">L</span>
          <span>
            <strong>Leon</strong>
            <small>Meine Aufgaben</small>
          </span>
          <span class="profile-arrow">›</span>
        </button>

        <button class="profile-button anouk" type="button" data-profile="anouk">
          <span class="profile-avatar">A</span>
          <span>
            <strong>Anouk</strong>
            <small>Meine Aufgaben</small>
          </span>
          <span class="profile-arrow">›</span>
        </button>
      </div>
    </div>
  </div>

  <div id="appView" class="app-shell" hidden>
    <header class="topbar">
      <div>
        <div class="eyebrow" id="profileEyebrow">GEMEINSAM · LIVE</div>
        <h1 id="appTitle">FiveTodo</h1>
      </div>
      <div class="topbar-actions">
        <button id="changeProfile" class="change-profile" type="button">Wechseln</button>
        <div class="status" id="status">
          <span class="dot"></span><span id="statusText">Verbinde…</span>
        </div>
      </div>
    </header>

    <div id="newTasksBanner" class="new-tasks-banner" hidden>
      <span class="new-tasks-dot"></span>
      <strong id="newTasksText">Neue Aufgaben</strong>
    </div>

    <main id="days" class="days" aria-live="polite"></main>
  </div>

  <div id="bravo" class="bravo" aria-hidden="true">
    <div class="bravo-card">
      <div class="confetti">✦ ✹ ✦</div>
      <div class="bravo-title">BRAVO!</div>
      <div class="bravo-sub">Erledigt. Stark gemacht.</div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
